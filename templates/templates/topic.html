<div style="animation:fadeInUp 0.5s ease-out;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <span style="font-size:2em;">{{ data.icon }}</span>
        <h4 style="color:white;font-weight:700;">{{ data.title }}</h4>
    </div>
    {% for step in data.steps %}
    <div style="background:rgba(255,255,255,0.03);padding:12px 16px;border-radius:12px;border-left:3px solid {{ data.color or '#6366f1' }};margin-bottom:10px;">
        <div style="color:white;font-weight:500;font-size:0.9em;">{{ loop.index }}. {{ step.step }}</div>
        <div style="color:var(--text-muted);font-size:0.8em;margin-top:2px;">💡 {{ step.tip }}</div>
    </div>
    {% endfor %}
    {% if data.shortcuts %}
    <div style="margin-top:12px;">
        <div style="color:var(--text-muted);font-size:0.8em;margin-bottom:8px;">⌨️ Shortcuts</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;">
            {% for shortcut in data.shortcuts %}
            <div style="background:rgba(99,102,241,0.06);padding:6px 10px;border-radius:8px;text-align:center;border:1px solid rgba(99,102,241,0.1);color:var(--text-muted);font-size:0.75em;">{{ shortcut }}</div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
    <div style="margin-top:14px;padding:14px;background:rgba(99,102,241,0.06);border-radius:12px;border:1px solid rgba(99,102,241,0.1);text-align:center;">
        <div style="color:var(--text-muted);font-size:0.8em;">📞 Msaada zaidi</div>
        <div style="font-weight:700;color:var(--secondary);">RAMADHAN KAJALA</div>
        <a href="tel:0748755636" style="color:var(--success);text-decoration:none;font-weight:600;">0748755636</a>
    </div>
</div>
